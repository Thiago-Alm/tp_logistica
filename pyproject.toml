[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "logistica"
version = "0.1.0"
description = "TP Persistencia Poliglota - Ingenieria de Datos II"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# E/F: errores y estilo PEP 8. I: orden de imports (isort).
# UP: sintaxis moderna. B: bugs comunes. SIM: simplificaciones.
select = ["E", "F", "I", "UP", "B", "SIM"]
